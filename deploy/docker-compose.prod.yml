# CryptoDash — production compose (optional alternative to bare-metal Caddyfile).
# Usage:  docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
# Requires APP_ENV=production and SESSION_SECRET/MASTER_KEY in .env (already generated by make run bootstrap).

services:
  cryptodash:
    image: ghcr.io/example/cryptodash:latest        # or build from Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?set in .env}
      - MASTER_KEY=${MASTER_KEY:?set in .env}
      - FRED_API_KEY=${FRED_API_KEY:-}
    volumes:
      - cryptodash-data:/app/data                   # embedded Postgres + cache (survives deploys)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8400/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cryptodash-data:
  caddy-data:
  caddy-config:
